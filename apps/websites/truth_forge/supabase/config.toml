# Supabase configuration for Truth Forge
# See: https://supabase.com/docs/guides/cli/config

project_id = "evgwynolvppakwicwzwe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://truth-forge.ai"
additional_redirect_urls = [
  "https://truth-forge.ai/**",
  "https://www.truth-forge.ai/**",
  "https://truth-forge.com/**",
  "https://www.truth-forge.com/**",
  "http://localhost:5173/**",
  "http://localhost:3000/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
