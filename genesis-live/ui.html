<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Genesis</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a25;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.15);
    --red: #ef4444;
    --red-dim: rgba(239, 68, 68, 0.15);
    --orange: #f59e0b;
    --cyan: #06b6d4;
    --pink: #ec4899;
    --purple: #a855f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header h1 span { color: var(--accent); }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
  }
  .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.offline { background: var(--red); }
  .status-bar {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .status-item { display: flex; align-items: center; gap: 4px; }

  /* ─── MAIN LAYOUT ─── */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
  }

  /* ─── CARDS ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* ─── DROP ZONE ─── */
  .drop-zone {
    grid-column: 1 / -1;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--surface);
    position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(99, 102, 241, 0.05);
    box-shadow: 0 0 30px var(--accent-glow);
  }
  .drop-zone.processing {
    border-color: var(--orange);
    box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
  }
  .drop-zone h2 {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .drop-zone p { color: var(--text-dim); font-size: 14px; }
  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* ─── PIPELINE ─── */
  .pipeline {
    grid-column: 1 / -1;
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
  }
  .pipe-stage {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--surface2);
    color: var(--text-dim);
    transition: all 0.4s;
    position: relative;
  }
  .pipe-stage.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 0 20px var(--accent-glow);
    animation: pulse-stage 1.5s ease-in-out infinite;
  }
  .pipe-stage.done {
    background: var(--green-dim);
    color: var(--green);
  }
  .pipe-arrow {
    color: var(--text-dim);
    font-size: 16px;
  }
  @keyframes pulse-stage {
    0%, 100% { box-shadow: 0 0 15px var(--accent-glow); }
    50% { box-shadow: 0 0 30px var(--accent-glow); }
  }

  /* ─── ATOM STREAM ─── */
  .atom-stream {
    max-height: 500px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .atom-card {
    background: var(--surface2);
    border-radius: 8px;
    padding: 12px;
    border-left: 3px solid var(--accent);
    animation: slideIn 0.3s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .atom-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .atom-type {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .atom-type.ENTITY { background: rgba(6, 182, 212, 0.2); color: var(--cyan); }
  .atom-type.CONCEPT { background: rgba(168, 85, 247, 0.2); color: var(--purple); }
  .atom-type.RELATIONSHIP { background: rgba(236, 72, 153, 0.2); color: var(--pink); }
  .atom-type.CLAIM { background: rgba(245, 158, 11, 0.2); color: var(--orange); }
  .atom-type.PATTERN { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
  .atom-type.QUESTION { background: rgba(34, 197, 94, 0.2); color: var(--green); }
  .atom-type.PROCEDURE { background: rgba(244, 63, 94, 0.2); color: #f43f5e; }
  .atom-type.METRIC { background: rgba(20, 184, 166, 0.2); color: #14b8a6; }
  .atom-type.CONTRADICTION { background: rgba(239, 68, 68, 0.2); color: var(--red); }
  .atom-type.UNKNOWN { background: rgba(100, 100, 120, 0.2); color: var(--text-dim); }

  .atom-content { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
  .atom-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 11px;
  }
  .tag {
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--text-dim);
  }
  .confidence-bar {
    width: 40px;
    height: 4px;
    background: var(--surface);
    border-radius: 2px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }
  .confidence-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--green);
    transition: width 0.3s;
  }

  /* ─── LOG ─── */
  .log {
    max-height: 500px;
    overflow-y: auto;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.8;
  }
  .log-entry { color: var(--text-dim); }
  .log-entry .time { color: var(--text-dim); opacity: 0.5; }
  .log-entry.error { color: var(--red); }
  .log-entry.success { color: var(--green); }
  .log-entry.info { color: var(--cyan); }

  /* ─── STATS ─── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .stat {
    text-align: center;
    padding: 12px;
    background: var(--surface2);
    border-radius: 8px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ─── INTAKE HISTORY ─── */
  .intake-list { display: flex; flex-direction: column; gap: 6px; }
  .intake-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 13px;
  }
  .intake-name { font-weight: 500; }
  .intake-count {
    background: var(--accent);
    color: white;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* ─── TEXT INPUT ─── */
  .text-input-area {
    grid-column: 1 / -1;
    display: none;
  }
  .text-input-area.show { display: block; }
  .text-input-area textarea {
    width: 100%;
    min-height: 120px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    padding: 12px;
    resize: vertical;
  }
  .text-input-area textarea:focus { outline: none; border-color: var(--accent); }
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--text-dim); }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* ─── EMPTY STATE ─── */
  .empty {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1><span>G</span>enesis</h1>
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot" id="scout-dot"></span>
      <span id="scout-label">Scout</span>
    </div>
    <div class="status-item">
      <span id="atom-count-header">0 atoms</span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DROP ZONE -->
  <div class="drop-zone" id="drop-zone">
    <h2>Drop anything here</h2>
    <p>Text, code, markdown, JSON, CSV — or paste text below</p>
    <input type="file" id="file-input" multiple>
  </div>

  <!-- PIPELINE -->
  <div class="pipeline" id="pipeline" style="display:none;">
    <div class="pipe-stage" id="stage-intake">Intake</div>
    <span class="pipe-arrow">&rarr;</span>
    <div class="pipe-stage" id="stage-atomize">Atomize</div>
    <span class="pipe-arrow">&rarr;</span>
    <div class="pipe-stage" id="stage-store">Store</div>
  </div>

  <!-- TEXT INPUT -->
  <div class="text-input-area" id="text-area">
    <div class="card">
      <div class="card-title">Paste text to atomize</div>
      <textarea id="text-input" placeholder="Paste any text here..."></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" onclick="atomizeText()">Atomize</button>
        <button class="btn btn-ghost" onclick="toggleText()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="card">
    <div class="card-title">System</div>
    <div class="stats-grid" id="stats">
      <div class="stat">
        <div class="stat-value" id="stat-atoms">0</div>
        <div class="stat-label">Atoms</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-files">0</div>
        <div class="stat-label">Files</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-scout">-</div>
        <div class="stat-label">Scout</div>
      </div>
    </div>
    <!-- INTAKE HISTORY -->
    <div class="card-title" style="margin-top:16px;">Recent Files</div>
    <div class="intake-list" id="intake-list">
      <div class="empty">No files processed yet</div>
    </div>
  </div>

  <!-- ATOM STREAM -->
  <div class="card">
    <div class="card-title">Knowledge Atoms</div>
    <div class="atom-stream" id="atom-stream">
      <div class="empty">Drop a file to see atoms appear</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="card" style="grid-column: 1 / -1;">
    <div class="card-title">Log</div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
// ─── STATE ───
let ws = null;
let atomCount = 0;
let fileCount = 0;
let scoutOnline = false;

// ─── WEBSOCKET ───
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => log('Connected to Genesis', 'info');

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleEvent(data);
  };

  ws.onclose = () => {
    log('Disconnected. Reconnecting...', 'error');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {};
}

function handleEvent(data) {
  switch(data.event) {
    case 'connected':
      updateScout(data.scout);
      atomCount = data.atoms_stored || 0;
      updateStats();
      break;

    case 'intake_start':
      log(`Intake: ${data.filename} (${data.file_type}, ${formatBytes(data.file_size)})`, 'info');
      setStage('intake');
      break;

    case 'atomize_start':
      setStage('atomize');
      log('Atomizing with Scout...', 'info');
      break;

    case 'store_start':
      setStage('store');
      break;

    case 'atom':
      addAtom(data.atom, data.intake_id);
      atomCount++;
      updateStats();
      break;

    case 'intake_complete':
      log(`Complete: ${data.filename} → ${data.atoms_count} atoms (${data.ms}ms, ${data.model})`, 'success');
      fileCount++;
      updateStats();
      addIntakeItem(data.filename, data.atoms_count);
      clearStages();
      document.getElementById('drop-zone').classList.remove('processing');
      break;

    case 'intake_skip':
      log(`Skipped: ${data.reason}`, 'error');
      clearStages();
      document.getElementById('drop-zone').classList.remove('processing');
      break;

    case 'error':
      log(`Error: ${data.error}`, 'error');
      clearStages();
      document.getElementById('drop-zone').classList.remove('processing');
      break;

    case 'heartbeat':
      break; // silent keepalive

    case 'pong':
      break;
  }
}

// ─── UI UPDATES ───
function updateScout(scout) {
  scoutOnline = scout.online;
  const dot = document.getElementById('scout-dot');
  const label = document.getElementById('scout-label');
  dot.className = 'status-dot ' + (scout.online ? 'online' : 'offline');
  label.textContent = scout.online
    ? `Scout (${scout.models.length} model${scout.models.length !== 1 ? 's' : ''})`
    : 'Scout offline';
  document.getElementById('stat-scout').textContent = scout.online ? 'ON' : 'OFF';
  document.getElementById('stat-scout').style.color = scout.online ? 'var(--green)' : 'var(--red)';
}

function updateStats() {
  document.getElementById('stat-atoms').textContent = atomCount;
  document.getElementById('stat-files').textContent = fileCount;
  document.getElementById('atom-count-header').textContent = `${atomCount} atom${atomCount !== 1 ? 's' : ''}`;
}

function setStage(active) {
  document.getElementById('pipeline').style.display = 'flex';
  ['intake', 'atomize', 'store'].forEach(s => {
    const el = document.getElementById(`stage-${s}`);
    el.classList.remove('active', 'done');
    if (s === active) el.classList.add('active');
    if (['intake','atomize','store'].indexOf(s) < ['intake','atomize','store'].indexOf(active)) {
      el.classList.add('done');
    }
  });
}

function clearStages() {
  setTimeout(() => {
    ['intake', 'atomize', 'store'].forEach(s => {
      document.getElementById(`stage-${s}`).classList.remove('active');
      document.getElementById(`stage-${s}`).classList.add('done');
    });
    setTimeout(() => {
      document.getElementById('pipeline').style.display = 'none';
      ['intake', 'atomize', 'store'].forEach(s => {
        document.getElementById(`stage-${s}`).classList.remove('done');
      });
    }, 2000);
  }, 800);
}

function addAtom(atom, intakeId) {
  const stream = document.getElementById('atom-stream');
  // Remove empty state
  const empty = stream.querySelector('.empty');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'atom-card';
  card.style.borderLeftColor = getAtomColor(atom.atom_type);

  const entities = (atom.entities || []).map(e => `<span class="tag">${e}</span>`).join('');
  const themes = (atom.themes || []).map(t => `<span class="tag">${t}</span>`).join('');
  const conf = atom.confidence || 0.5;

  card.innerHTML = `
    <div class="atom-header">
      <span class="atom-type ${atom.atom_type || 'UNKNOWN'}">${atom.atom_type || 'UNKNOWN'}</span>
      <span class="confidence-bar"><span class="confidence-fill" style="width:${conf * 100}%"></span></span>
    </div>
    <div class="atom-content">${escapeHtml(atom.content || '')}</div>
    <div class="atom-meta">${entities}${themes}</div>
  `;

  stream.insertBefore(card, stream.firstChild);

  // Keep only last 200 atoms in view
  while (stream.children.length > 200) {
    stream.removeChild(stream.lastChild);
  }
}

function addIntakeItem(filename, count) {
  const list = document.getElementById('intake-list');
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();

  const item = document.createElement('div');
  item.className = 'intake-item';
  item.innerHTML = `
    <span class="intake-name">${escapeHtml(filename)}</span>
    <span class="intake-count">${count} atoms</span>
  `;
  list.insertBefore(item, list.firstChild);

  while (list.children.length > 20) {
    list.removeChild(list.lastChild);
  }
}

function log(msg, type = '') {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  const time = new Date().toLocaleTimeString();
  entry.innerHTML = `<span class="time">${time}</span> ${escapeHtml(msg)}`;
  el.insertBefore(entry, el.firstChild);
  while (el.children.length > 100) el.removeChild(el.lastChild);
}

function getAtomColor(type) {
  const colors = {
    ENTITY: '#06b6d4', CONCEPT: '#a855f7', RELATIONSHIP: '#ec4899',
    CLAIM: '#f59e0b', PATTERN: '#6366f1', QUESTION: '#22c55e',
    PROCEDURE: '#f43f5e', METRIC: '#14b8a6', CONTRADICTION: '#ef4444',
  };
  return colors[type] || '#6366f1';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1048576).toFixed(1) + 'MB';
}

// ─── FILE HANDLING ───
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  e.target.value = ''; // reset for re-upload
});

async function handleFiles(files) {
  for (const file of files) {
    await uploadFile(file);
  }
}

async function uploadFile(file) {
  dropZone.classList.add('processing');
  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch('/api/atomize', { method: 'POST', body: formData });
    const data = await resp.json();

    if (data.status === 'error') {
      log(`Error atomizing ${file.name}: ${data.error}`, 'error');
    }
    // Most updates come through WebSocket, but handle non-WS case
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      if (data.atoms) {
        data.atoms.forEach(a => addAtom(a, data.id));
        atomCount += data.atoms.length;
        fileCount++;
        updateStats();
        addIntakeItem(file.name, data.atoms.length);
        log(`Complete: ${file.name} → ${data.atoms.length} atoms`, 'success');
      }
      dropZone.classList.remove('processing');
    }
  } catch (err) {
    log(`Upload failed: ${err.message}`, 'error');
    dropZone.classList.remove('processing');
  }
}

// ─── TEXT INPUT ───
function toggleText() {
  const area = document.getElementById('text-area');
  area.classList.toggle('show');
}

// Add paste-text toggle to drop zone
dropZone.addEventListener('click', (e) => {
  if (e.target === dropZone || e.target.tagName === 'H2' || e.target.tagName === 'P') {
    // If clicking the text part (not the file input), toggle text area
    // But only if shift is held — normal click opens file picker
    if (e.shiftKey) {
      e.preventDefault();
      toggleText();
    }
  }
});

async function atomizeText() {
  const text = document.getElementById('text-input').value.trim();
  if (!text) return;

  dropZone.classList.add('processing');
  const formData = new FormData();
  formData.append('text', text);
  formData.append('source', 'manual_paste');

  try {
    const resp = await fetch('/api/atomize/text', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      if (data.atoms) {
        data.atoms.forEach(a => addAtom(a, data.id));
        atomCount += data.atoms.length;
        fileCount++;
        updateStats();
        log(`Complete: pasted text → ${data.atoms.length} atoms`, 'success');
      }
      dropZone.classList.remove('processing');
    }
    document.getElementById('text-input').value = '';
    document.getElementById('text-area').classList.remove('show');
  } catch (err) {
    log(`Text atomization failed: ${err.message}`, 'error');
    dropZone.classList.remove('processing');
  }
}

// ─── INITIAL LOAD ───
async function init() {
  // Load status
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    updateScout(data.scout);
    atomCount = data.atoms_stored || 0;
    fileCount = data.files_processed || 0;
    updateStats();
    log(`Genesis alive. ${atomCount} atoms stored. ${fileCount} files processed.`, 'info');
  } catch (err) {
    log('Cannot reach Genesis backend', 'error');
  }

  // Load existing atoms
  try {
    const resp = await fetch('/api/atoms?limit=50');
    const atoms = await resp.json();
    atoms.reverse().forEach(a => {
      addAtom({
        atom_type: a.atom_type,
        content: a.content,
        entities: JSON.parse(a.entities || '[]'),
        themes: JSON.parse(a.themes || '[]'),
        confidence: a.confidence,
      }, a.id);
    });
  } catch (err) {}

  // Load intake history
  try {
    const resp = await fetch('/api/intake?limit=10');
    const intake = await resp.json();
    intake.reverse().forEach(i => {
      if (i.status === 'complete') addIntakeItem(i.filename, i.atom_count);
    });
  } catch (err) {}

  // Connect WebSocket for live updates
  connectWS();
}

init();
</script>
